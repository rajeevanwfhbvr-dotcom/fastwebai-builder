<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FastWeb AI Builder — Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0f1724;
      color: #fff;
      height: 100vh;
      display: flex;
    }
    .left {
      width: 40%;
      padding: 20px;
      box-sizing: border-box;
      border-right: 1px solid rgba(255,255,255,0.1);
      display: flex;
      flex-direction: column;
    }
    .right {
      flex: 1;
      background: #fff;
      color: #000;
      padding: 12px;
      box-sizing: border-box;
    }
    h1 {
      margin-top: 0;
    }
    textarea {
      flex: 1;
      width: 100%;
      resize: none;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #071127;
      color: #fff;
      font-size: 14px;
    }
    button {
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: #7c3aed;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #6d28d9;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 1px solid #ddd;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <div class="left">
    <h1>FastWeb AI Builder — Demo</h1>
    <textarea id="prompt" placeholder="Describe the website (e.g. Gym website with pricing and contact page)"></textarea>
    <button onclick="generate()">Create</button>
  </div>

  <div class="right">
    <h3>Preview will appear here</h3>
    <iframe id="preview"></iframe>
  </div>

  <script>
    async function generate() {
      const prompt = document.getElementById("prompt").value;
      if (!prompt) {
        alert("Please enter a description");
        return;
      }

      const res = await fetch("/api/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt })
      });

      const data = await res.json();

      document.getElementById("preview").srcdoc =
        data.html || "<h2>Error generating site</h2>";
    }
  </script>

</body>
</html>
